  services:
    postgres:
      image: postgres:16-alpine
      container_name: postgres-employee-management
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "5000:5432"
      volumes:
        - pg-data-employee-management:/var/lib/postgresql/data

    adminer:
      image: adminer
      container_name: adminer-employee-management
      ports:
        - "8082:8080"

  volumes:
    pg-data-employee-management: